<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Duru Güzellik & Nail Bar - Ana Sayfa</title>
    <style>
        body {
            margin: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(16px);
            border-radius: 16px;
            padding: 40px;
            max-width: 600px;
            text-align: center;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
        }
        h1 {
            font-size: 2.5rem;
            margin: 0 0 16px 0;
            color: #38bdf8;
        }
        p {
            font-size: 1.1rem;
            color: #cbd5e1;
            line-height: 1.6;
        }
        .info {
            margin: 24px 0;
            padding: 16px;
            background: rgba(15, 23, 42, 0.4);
            border-radius: 8px;
            text-align: left;
        }
        .info-item {
            margin: 8px 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .btn {
            display: inline-block;
            background: #38bdf8;
            color: #0f172a;
            padding: 12px 24px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            margin-top: 16px;
            transition: background 0.2s;
        }
        .btn:hover {
            background: #0ea5e9;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Duru Güzellik & Nail Bar</h1>
        <p>güzellik merkezi alanında Kadıköy, İstanbul bölgesinde kaliteli hizmet sunmaktayız.</p>
        <div class="info">
            <div class="info-item">📍 <strong>Adres:</strong> Çardak Sokak Şaşmaz Sitesi Blok-2 No:4 D:1 34742, Kozyatağı Kavşağı, 34750 Kadıköy/İstanbul </div>
            <div class="info-item">📞 <strong>Telefon:</strong> 02164459692</div>
        </div>
        <a href="tel:02164459692" class="btn">İletişime Geçin</a>
    </div>
</body>
</html>
